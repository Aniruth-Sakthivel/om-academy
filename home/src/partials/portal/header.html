<!-- Apply the saved theme before first paint, so dark mode doesn't flash light -->
<script>try{var t=localStorage.getItem("om-portal:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
